<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Nota</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title">🐒 NotMave 🐒</h1>

    <!-- Carrusel de textos -->
    <div id="carousel" class="carousel">
      <div class="carousel-item active" id="btcPriceSlide">💲 Cargando precio de Bitcoin...</div>
      <div class="carousel-item" id="btcVolumeSlide">📊 Cargando volumen de transacciones...</div>
      <div class="carousel-item" id="btcHashrateSlide">⚡ Cargando hashrate de la red...</div>
    </div>

    <form id="searchForm" onsubmit="fetchNote(); return false;" class="form">
      <input id="searchNoteName" placeholder="Nombre de la nota" required class="input" />
      <input id="searchPassword" type="password" placeholder="Contraseña" required class="input" />
      <button type="submit" class="btn">Buscar Nota</button>
    </form>
    <p id="noteResult" class="result"></p>
    <button id="backButton" class="btn hidden" onclick="goBack()">Regresar</button>
  </div>
<script src="/static/search.js"></script>
</body>
</html>
