<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Nota</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title">🐒 Buscar Nota 🐒</h1>
    <form id="searchForm" onsubmit="fetchNote(); return false;" class="form">
      <input id="searchNoteName" placeholder="Nombre de la nota" required class="input" />
      <input id="searchPassword" type="password" placeholder="Contraseña" required class="input" />
      <button type="submit" class="btn">Buscar Nota</button>
    </form>
    <p id="noteResult" class="result"></p>
  </div>

  <script>
    async function fetchNote() {
      document.getElementById('searchForm').style.opacity = '0'; // Desvanecer el formulario
      const name = document.getElementById('searchNoteName').value;
      const password = document.getElementById('searchPassword').value;

      const response = await fetch(`/get-note/${name}`);
      const result = await response.json();

      setTimeout(() => {
        if (result.error) {
          document.getElementById('noteResult').innerText = result.error;
          document.getElementById('searchForm').style.opacity = '1'; // Mostrar el formulario si hay error
          return;
        }

        try {
          const decryptedContent = CryptoJS.AES.decrypt(result.content, password).toString(CryptoJS.enc.Utf8);
          if (!decryptedContent) {
            throw new Error("La contraseña es incorrecta o los datos están corruptos.");
          }
          document.getElementById('noteResult').innerText = `Contenido de la nota: ${decryptedContent}`;
        } catch (e) {
          document.getElementById('noteResult').innerText = e.message;
          document.getElementById('searchForm').style.opacity = '1'; // Mostrar el formulario si hay error
        }
      }, 500); // Añadir un pequeño retraso para la animación
    }
  </script>
</body>
</html>
