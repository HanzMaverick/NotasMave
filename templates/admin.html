<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador de Notas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Administrador de Notas</h1>

    <!-- Sección para guardar una nota -->
    <div class="card mb-4">
      <div class="card-header">Guardar Nota</div>
      <div class="card-body">
        <form onsubmit="saveNote(); return false;">
          <div class="mb-3">
            <label for="noteName" class="form-label">Nombre de la Nota</label>
            <input id="noteName" class="form-control" placeholder="Nombre de la nota" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" placeholder="Contraseña" required />
          </div>
          <div class="mb-3">
            <label for="noteContent" class="form-label">Contenido</label>
            <textarea id="noteContent" class="form-control" placeholder="Escribe tu nota aquí" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Guardar Nota</button>
        </form>
        <p id="message" class="mt-2"></p>
      </div>
    </div>

    <!-- Sección para buscar una nota -->
    <div class="card mb-4">
      <div class="card-header">Buscar Nota</div>
      <div class="card-body">
        <form id="searchForm" onsubmit="fetchNote(); return false;">
          <div class="mb-3">
            <label for="searchNoteName" class="form-label">Nombre de la Nota</label>
            <input id="searchNoteName" class="form-control" placeholder="Nombre de la nota" required />
          </div>
          <div class="mb-3">
            <label for="searchPassword" class="form-label">Contraseña</label>
            <input id="searchPassword" type="password" class="form-control" placeholder="Contraseña" required />
          </div>
          <button type="submit" class="btn btn-primary">Buscar Nota</button>
        </form>
        <p id="noteResult" class="mt-2"></p>
        <button id="backButton" class="btn btn-secondary mt-2 hidden" onclick="goBack()">Regresar</button>
      </div>
    </div>

    <!-- Sección para editar una nota -->
    <div class="card">
      <div class="card-header">Editar Nota</div>
      <div class="card-body">
        <form onsubmit="editNote(); return false;">
          <div class="mb-3">
            <label for="editName" class="form-label">Nombre de la Nota</label>
            <input id="editName" class="form-control" placeholder="Nombre de la nota" required />
          </div>
          <div class="mb-3">
            <label for="editPassword" class="form-label">Contraseña</label>
            <input id="editPassword" type="password" class="form-control" placeholder="Contraseña" required />
          </div>
          <div class="mb-3">
            <label for="editContent" class="form-label">Nuevo Contenido</label>
            <textarea id="editContent" class="form-control" placeholder="Nuevo contenido de la nota" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Editar Nota</button>
        </form>
        <p id="editMessage" class="mt-2"></p>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
